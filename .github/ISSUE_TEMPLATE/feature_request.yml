name: Feature or idea
description: Suggest a feature, a model, or a change to how Tessera works.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The research question or use case behind the request helps a lot.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Tessera to do?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Papers or tools
      description: If this comes from a paper or another simulator, link it here.
  - type: checkboxes
    id: help
    attributes:
      label: Can you help build it?
      options:
        - label: I'd like to work on this myself.
