[package]
name = "dsent-sys"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "FFI bindings to DSENT for router and link power/area. Reports itself as degraded until the DSENT library is linked."

[dependencies]
tessera-core.workspace = true
tessera-params.workspace = true
tessera-power.workspace = true

[features]
# Opt-in: bind the external DSENT C++ library. Off by default so the workspace
# builds without the library present (the model then reports degraded).
link = []
