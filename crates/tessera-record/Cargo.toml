[package]
name = "tessera-record"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tessera keyframe/replay recorder: deterministic SeekTo(cycle) via keyframe + re-simulation, the Phase 4 replay-equivalence oracle."

[dependencies]
tessera-core = { workspace = true, features = ["snapshot"] }
bincode.workspace = true
thiserror.workspace = true
tessera-stats = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }

[features]
# Off by default: the Arrow/Parquet event-stream writer pulls a large
# dependency tree, mirroring `tessera-stats`'s own `parquet` feature.
events = ["dep:tessera-stats", "dep:arrow", "dep:parquet"]
# Off by default: `rusqlite`'s `bundled` feature compiles SQLite's C
# amalgamation.
catalog = ["dep:rusqlite"]
