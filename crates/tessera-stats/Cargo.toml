[package]
name = "tessera-stats"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tessera metrics collection and export: latency-throughput CSV plus a bounded-memory streaming time-series with optional Arrow/Parquet output (P3-F14)."

[dependencies]
tessera-core.workspace = true
arrow = { version = "53", optional = true }
parquet = { version = "53", optional = true }

[features]
# Off by default: the Arrow/Parquet writer pulls a large dependency tree, so it
# is opt-in. The bounded-memory streaming core (P3-N2) needs no extra deps.
parquet = ["dep:arrow", "dep:parquet"]
