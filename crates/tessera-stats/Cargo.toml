[package]
name = "tessera-stats"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Metric collection for Tessera: latency-throughput CSV and a bounded-memory time series with optional Parquet export."

[dependencies]
tessera-core.workspace = true
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }

[features]
# Off by default: the Arrow/Parquet writer pulls a large dependency tree, so it
# is opt-in. The bounded-memory streaming core (P3-N2) needs no extra deps.
parquet = ["dep:arrow", "dep:parquet"]
