[package]
name = "tessera-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tessera headless runner: latency-throughput sweeps over a 2D mesh."

[lib]
name = "tessera_cli"
path = "src/lib.rs"

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
tessera-core.workspace = true
tessera-model.workspace = true
tessera-routing.workspace = true
tessera-traffic.workspace = true
tessera-stats.workspace = true
tessera-plugin.workspace = true
