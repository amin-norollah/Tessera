[package]
name = "tessera-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tessera headless runner: latency-throughput sweeps over a 2D mesh."
# Test files use the `*.test.rs` convention; a dotted stem is not a legal crate
# name, so each integration test target is declared explicitly below.
autotests = false

[lib]
name = "tessera_cli"
path = "src/lib.rs"

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
tessera-core.workspace = true
tessera-model.workspace = true
tessera-routing.workspace = true
tessera-traffic.workspace = true
tessera-stats.workspace = true
tessera-config.workspace = true
tessera-plugin.workspace = true

[dev-dependencies]
tessera-params.workspace = true
tessera-power.workspace = true
tessera-thermal.workspace = true
tessera-diag.workspace = true
tessera-record = { workspace = true, features = ["events", "catalog"] }
parquet.workspace = true

[[test]]
name = "allocators"
path = "tests/allocators.test.rs"

[[test]]
name = "power_accounting"
path = "tests/power_accounting.test.rs"

[[test]]
name = "diagnostics"
path = "tests/diagnostics.test.rs"

[[test]]
name = "analytical"
path = "tests/analytical.test.rs"

[[test]]
name = "bimodal_traffic"
path = "tests/bimodal_traffic.test.rs"

[[test]]
name = "credit_conservation"
path = "tests/credit_conservation.test.rs"

[[test]]
name = "determinism"
path = "tests/determinism.test.rs"

[[test]]
name = "no_flit_loss"
path = "tests/no_flit_loss.test.rs"

[[test]]
name = "plugin"
path = "tests/plugin.test.rs"

[[test]]
name = "recording"
path = "tests/recording.test.rs"

[[test]]
name = "replay_equivalence"
path = "tests/replay_equivalence.test.rs"

[[test]]
name = "routing"
path = "tests/routing.test.rs"

[[test]]
name = "routing_table_import"
path = "tests/routing_table_import.test.rs"

[[test]]
name = "selection"
path = "tests/selection.test.rs"

[[test]]
name = "traffic_realism"
path = "tests/traffic_realism.test.rs"

[[test]]
name = "virtual_channels"
path = "tests/virtual_channels.test.rs"

[[test]]
name = "zero_load_latency"
path = "tests/zero_load_latency.test.rs"
