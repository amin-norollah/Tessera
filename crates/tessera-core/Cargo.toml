[package]
name = "tessera-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core of the Tessera NoC simulator: handles, arenas, SoA storage, RNG streams, and the cycle-accurate kernel."

[dependencies]
serde = { workspace = true, optional = true }

[features]
# Off by default, so the engine spine stays dependency-free. Enables
# `EngineSnapshot` + `Simulation::snapshot`/`restore` (P4-F1, `tessera-record`'s
# keyframe writer/reader).
snapshot = ["dep:serde"]
