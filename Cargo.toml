[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
repository = "https://github.com/tessera-noc/tessera"

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }
tessera-model = { path = "crates/tessera-model" }
tessera-routing = { path = "crates/tessera-routing" }
tessera-traffic = { path = "crates/tessera-traffic" }
tessera-stats = { path = "crates/tessera-stats" }
tessera-config = { path = "crates/tessera-config" }
tessera-plugin = { path = "crates/tessera-plugin" }
tessera-record = { path = "crates/tessera-record" }
tessera-params = { path = "crates/tessera-params" }
tessera-power = { path = "crates/tessera-power" }
tessera-thermal = { path = "crates/tessera-thermal" }
tessera-diag = { path = "crates/tessera-diag" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
bincode = "1"
arrow = "53"
parquet = "53"
rusqlite = "0.32"
